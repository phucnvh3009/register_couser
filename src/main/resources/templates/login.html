<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>

<main class="auth-page">
    <div class="auth-card">
        <section class="auth-form">
            <a href="/" class="brand"><span class="brand-mark">M</span>Management System</a>

            <p class="kicker">Welcome back</p>
            <h1>Log in to your account</h1>
            <p class="lead">Pick up where you left off.</p>

            <div class="alert" id="formAlert" role="alert" hidden></div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                           required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters"
                           autocomplete="current-password" minlength="6" required aria-describedby="passwordHint">
                    <p class="hint" id="passwordHint">Must be at least 6 characters.</p>
                </div>

                <button type="submit" class="btn">Log in &nbsp;&rarr;</button>
                <div class="social-login">
                    <p>Hoặc đăng nhập bằng</p>

                    <a class="google-login-button"
                       href="/oauth2/authorization/google"
                       aria-label="Continue with Google"
                    >
                        <span class="google-icon" aria-hidden="true">
                            <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 48 48"
                                    width="20"
                                    height="20"
                            >
                                <path
                                        fill="#EA4335"
                                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                                />
                                <path
                                        fill="#4285F4"
                                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                                />
                                <path
                                        fill="#FBBC05"
                                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                                />
                                <path
                                        fill="#34A853"
                                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                                />
                            </svg>
                        </span>

                        <span>Continue with Google</span>
                    </a>
                </div>
            </form>

            <p class="switch">New here?<a href="/register">Create an account</a></p>
        </section>

        <aside class="auth-art" aria-hidden="true">
            <span class="sparkle">&#10035;</span>
            <p class="art-kicker">Make room for what matters</p>
            <h2>Good things happen when you show up.</h2>
            <p class="art-sub">Your next chapter starts here.</p>
        </aside>
    </div>
</main>

<div class="modal" id="successModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
        <div class="modal-icon" aria-hidden="true">&#10003;</div>
        <h2 id="modalTitle"></h2>
        <p id="modalText"></p>
        <button type="button" class="btn" id="modalButton"></button>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
